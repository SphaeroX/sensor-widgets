name: sensor_widgets
description: "Settings dashboard and native home-screen widgets for InfluxDB."
publish_to: 'none'
version: 1.0.3+5

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  home_widget: ^0.7.0
  http: ^1.2.2
  share_plus: ^12.0.2
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  generate: true
  uses-material-design: true
