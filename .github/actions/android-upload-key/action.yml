name: Android upload key
description: >
  Writes the Google Play upload keystore from repository secrets and creates
  android/key.properties, so release builds are signed with the upload key.
  Fails when a secret is missing instead of falling back to the debug key.

inputs:
  keystore-base64:
    description: Base64 of the upload keystore (.jks)
    required: true
  keystore-password:
    description: Keystore password
    required: true
  key-password:
    description: Key password
    required: true
  key-alias:
    description: Key alias
    required: true

runs:
  using: composite
  steps:
    - name: Write keystore and key.properties
      shell: bash
      env:
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEY_PASSWORD: ${{ inputs.key-password }}
        KEY_ALIAS: ${{ inputs.key-alias }}
      run: |
        for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
          if [ -z "${!name}" ]; then
            echo "::error::Secret for $name is missing (see docs/architecture.md, Play upload)"
            exit 1
          fi
        done
        keystore="$RUNNER_TEMP/upload-keystore.jks"
        echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
        {
          echo "storeFile=$keystore"
          echo "storePassword=$KEYSTORE_PASSWORD"
          echo "keyPassword=$KEY_PASSWORD"
          echo "keyAlias=$KEY_ALIAS"
        } > android/key.properties
