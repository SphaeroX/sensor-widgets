name: Screenshots

# Regenerates the README screenshots (docs/screenshots/*.png) from
# screenshot_test/ and commits them when they changed. Start it from the
# Actions tab ("Run workflow").
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    name: Generate README screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # The harness loads Roboto from the SDK cache; the restored cache can lack
      # it, so download the Material fonts again and fail early if still missing.
      - name: Download Material fonts
        run: |
          root="$(dirname "$(dirname "$(which flutter)")")"
          rm -rf "$root/bin/cache/artifacts/material_fonts" "$root/bin/cache/material_fonts.stamp"
          flutter precache --universal
          ls -la "$root/bin/cache/artifacts/material_fonts"
          find "$root" -iname 'roboto*' | head -20
          test -f "$root/bin/cache/artifacts/material_fonts/roboto-regular.ttf"

      - name: Generate screenshots
        run: flutter test screenshot_test

      - name: Commit changed screenshots
        run: |
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate README screenshots"
          git push
