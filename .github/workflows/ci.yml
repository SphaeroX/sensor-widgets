name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  dart:
    name: Dart Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze project
        run: flutter analyze

      - name: Run Dart tests
        run: flutter test --coverage

  android:
    name: Android Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Run ktlint
        run: cd android && ./gradlew :app:ktlintCheck

      - name: Run Android unit tests
        run: cd android && ./gradlew test

      - name: Build Android APK (Release check)
        run: flutter build apk --release

  ios:
    name: iOS Lint & Simulator Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint --strict

      - name: Run Swift unit tests
        run: swift test --package-path ios

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Simulator (Unsigned)
        run: flutter build ios --simulator --no-codesign
