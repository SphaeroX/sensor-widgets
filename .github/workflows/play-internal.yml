name: Upload to Google Play (testing)

# Builds a signed AAB and uploads it with fastlane (android/fastlane/Fastfile).
# The versionCode is taken from Play (highest code + 1), the versionName from
# pubspec.yaml. Setup and secrets: docs/architecture.md.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha]
        default: internal
      release_status:
        description: "completed = roll out to testers, draft = finish in the Play Console"
        type: choice
        options: [completed, draft]
        default: completed

permissions:
  contents: read

concurrency:
  group: play-upload
  cancel-in-progress: false

jobs:
  upload:
    name: Build & upload AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Prepare upload key
        uses: ./.github/actions/android-upload-key
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Build and upload with fastlane
        working-directory: android
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: >
          bundle exec fastlane android internal
          track:${{ inputs.track }}
          release_status:${{ inputs.release_status }}

      - name: Keep the AAB as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
